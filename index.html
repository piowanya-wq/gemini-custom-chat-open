<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#11131a">
<title>Gemini Custom Chat</title><link rel="manifest" href="./manifest.webmanifest">
<style>
:root{--bg:#0f1117;--panel:#171a23;--panel2:#202431;--text:#f4f4f7;--muted:#aeb4c2;--line:#303646;--accent:#bda8ff;--danger:#ffb4b4;--user:#2c3142;--assistant:#1e2430}*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}body{overflow:hidden}button,input,textarea{font:inherit}button{cursor:pointer}.app{height:100dvh;display:grid;grid-template-rows:auto 1fr auto}header{display:flex;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;border-bottom:1px solid var(--line);background:rgba(15,17,23,.96);backdrop-filter:blur(10px)}.title{font-weight:800}.sub{font-size:12px;color:var(--muted)}.iconbtn,.primary,.ghost,.danger{border:0;border-radius:12px;padding:10px 13px;color:var(--text);background:var(--panel2)}.primary{background:var(--accent);color:#17131f;font-weight:800}.ghost{background:transparent;border:1px solid var(--line)}.danger{background:transparent;border:1px solid #6a4040;color:var(--danger)}#chat{overflow-y:auto;padding:16px 12px 24px;scroll-behavior:smooth}.msg{max-width:86%;margin:0 0 12px;padding:12px 14px;border-radius:18px;white-space:pre-wrap;word-break:break-word;line-height:1.6}.user{margin-left:auto;background:var(--user);border-bottom-right-radius:6px}.model{margin-right:auto;background:var(--assistant);border:1px solid var(--line);border-bottom-left-radius:6px}.meta{font-size:11px;color:var(--muted);margin-bottom:5px}.empty{max-width:560px;margin:20vh auto 0;color:var(--muted);text-align:center;line-height:1.8}.composer{padding:10px 10px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--panel)}.row{display:flex;gap:8px;align-items:flex-end}#prompt{flex:1;min-height:46px;max-height:180px;resize:none;border:1px solid var(--line);background:#10131a;color:var(--text);border-radius:16px;padding:12px 14px;outline:none}#prompt:focus,input:focus,textarea:focus{border-color:var(--accent)}#send{min-width:70px;height:46px}dialog{width:min(94vw,620px);max-height:88dvh;border:1px solid var(--line);border-radius:20px;background:var(--panel);color:var(--text);padding:0}dialog::backdrop{background:rgba(0,0,0,.68)}.dlghead{display:flex;justify-content:space-between;align-items:center;padding:16px;border-bottom:1px solid var(--line)}.dlgbody{padding:16px;overflow:auto;max-height:68dvh}label{display:block;font-weight:700;margin:0 0 7px}.field{margin-bottom:16px}input,textarea.settings{width:100%;border:1px solid var(--line);background:#10131a;color:var(--text);border-radius:12px;padding:11px;outline:none}textarea.settings{min-height:180px;resize:vertical;line-height:1.55}.hint{font-size:12px;color:var(--muted);line-height:1.5;margin-top:6px}.check{display:flex;gap:9px;align-items:center;font-weight:500}.check input{width:auto}.dlgfoot{display:flex;gap:8px;justify-content:flex-end;padding:14px 16px;border-top:1px solid var(--line)}.status{font-size:12px;color:var(--muted);min-height:18px;padding:5px 4px 0}.typing{opacity:.7;font-style:italic}.message-actions{position:absolute;right:7px;top:7px;border:0;background:transparent;color:var(--muted);font-size:20px;font-weight:800;line-height:1;padding:4px 8px}.msg{position:relative;padding-right:42px}@media(min-width:800px){.app{max-width:760px;margin:auto;border-left:1px solid var(--line);border-right:1px solid var(--line)}}
select{width:100%;border:1px solid var(--line);background:#10131a;color:var(--text);border-radius:12px;padding:11px;outline:none}</style></head>
<body><div class="app"><header><div><div class="title">Gemini Custom Chat</div><div class="sub" id="modelLabel">モデル未設定</div></div><button class="iconbtn" id="openSettings">設定</button></header><main id="chat"><div class="empty" id="empty">APIキーとカスタム指示を設定して、話しかけてね。<br>会話はこの端末のブラウザ内だけに保存できます。</div></main><footer class="composer"><div class="row"><textarea id="prompt" rows="1" placeholder="メッセージを入力…"></textarea><button class="primary" id="send">送信</button></div><div class="status" id="status"></div></footer></div>
<dialog id="settings"><div class="dlghead"><strong>接続とカスタム指示の設定</strong><button class="ghost" id="closeSettings">閉じる</button></div><div class="dlgbody"><div class="field"><label for="apiKey">Gemini API Key</label><input id="apiKey" type="password" autocomplete="off" placeholder="AIza…"><label class="check" style="margin-top:9px"><input id="saveKey" type="checkbox">この端末にAPIキーを保存する</label><div class="hint">共有端末では保存しないでください。公開サイトへ置く場合もキーを埋め込まないでください。</div></div><div class="field"><label for="model">モデル</label><input id="model" list="models" value="gemini-2.5-flash"><datalist id="models"><option value="gemini-2.5-flash"><option value="gemini-2.5-pro"></datalist><div class="hint">利用できない場合はGoogle AI Studioに表示されるモデルIDを直接入力してください。</div></div><div class="field"><label for="systemInstruction">カスタム指示</label><textarea class="settings" id="systemInstruction" placeholder="口調・関係・守ってほしいことを書きます。"></textarea></div><div class="field"><label for="historyTurns">APIへ送る過去履歴</label><select id="historyTurns"><option value="all">全履歴</option><option value="10">直近10往復</option><option value="20">直近20往復</option><option value="30">直近30往復</option><option value="50">直近50往復</option></select><div class="hint">画面の履歴は消えません。Geminiへ送る会話だけを絞ります。カスタム指示は毎回送られます。</div></div><div class="field"><label for="temperature">温度（0〜2）</label><input id="temperature" type="number" min="0" max="2" step="0.1" value="1.0"></div><div class="field"><label for="maxTokens">最大出力トークン</label><input id="maxTokens" type="number" min="64" max="8192" step="64" value="2048"></div><div class="field"><button class="danger" id="clearChat">会話履歴を消去</button></div></div><div class="dlgfoot"><button class="primary" id="saveSettings">保存</button></div></dialog>
<script>
(()=>{
const $=q=>document.querySelector(q),chat=$("#chat"),empty=$("#empty"),prompt=$("#prompt"),status=$("#status"),settings=$("#settings"),STORAGE="gemini-custom-chat-v1";
let state={apiKey:"",saveKey:false,model:"gemini-2.5-flash",systemInstruction:"",historyTurns:20,temperature:1,maxTokens:2048,messages:[]},busy=false;
function load(){try{const s=JSON.parse(localStorage.getItem(STORAGE)||"{}");state={...state,...s};if(!state.saveKey)state.apiKey="";if(!Array.isArray(state.messages))state.messages=[];if(!["all",10,20,30,50].includes(state.historyTurns))state.historyTurns=20}catch{}sync();render()}
function persist(){const s={...state};if(!state.saveKey)s.apiKey="";localStorage.setItem(STORAGE,JSON.stringify(s))}
function sync(){$("#apiKey").value=state.apiKey||"";$("#saveKey").checked=!!state.saveKey;$("#model").value=state.model||"gemini-2.5-flash";$("#systemInstruction").value=state.systemInstruction||"";$("#historyTurns").value=String(state.historyTurns??20);$("#temperature").value=state.temperature??1;$("#maxTokens").value=state.maxTokens??2048;$("#modelLabel").textContent=state.model||"モデル未設定"}
function esc(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function render(){chat.querySelectorAll(".msg").forEach(n=>n.remove());empty.style.display=state.messages.length?"none":"block";state.messages.forEach((m,i)=>{const el=document.createElement("div");el.className="msg "+(m.role==="user"?"user":"model");el.innerHTML="<div class=\"meta\">"+(m.role==="user"?"あなた":"Gemini")+"</div>"+esc(m.text)+"<button class=\"message-actions\" aria-label=\"このメッセージの操作\">…</button>";const open=e=>{e.preventDefault();actions(i)};el.querySelector("button").addEventListener("click",open);el.addEventListener("contextmenu",open);let timer;el.addEventListener("touchstart",()=>timer=setTimeout(()=>open(new Event("open")),600),{passive:true});["touchend","touchmove","touchcancel"].forEach(t=>el.addEventListener(t,()=>clearTimeout(timer),{passive:true}));chat.appendChild(el)});chat.scrollTop=chat.scrollHeight}
function grow(){prompt.style.height="auto";prompt.style.height=Math.min(prompt.scrollHeight,180)+"px"}
function apiHistory(){if(state.historyTurns==="all")return state.messages;const users=state.messages.reduce((a,m,i)=>(m.role==="user"&&a.push(i),a),[]);return state.messages.slice(users[Math.max(0,users.length-(Number(state.historyTurns)||20))]??0)}
function actions(i){if(busy)return;const m=state.messages[i],labels=m.role==="user"?["このメッセージを編集","このメッセージ以降を削除","このメッセージだけ削除"]:["このメッセージを編集","このメッセージ以降を削除","このメッセージだけ削除","ここから再生成"];const n=Number(window.prompt((m.role==="user"?"あなたのメッセージ":"Geminiの返答")+"\\n\\n番号を入力してね。\\n"+labels.map((x,j)=>(j+1)+". "+x).join("\\n")));if(!n)return;if(n===1)return m.role==="user"?editUser(i):editModel(i);if(n===2)return deleteFrom(i);if(n===3)return deleteOnly(i);if(n===4)return regenerate(i)}
function editUser(i){if(!confirm("この発言以降の会話を消して、入力欄で書き直しますか？"))return;const text=state.messages[i].text;state.messages.splice(i);prompt.value=text;persist();render();grow();prompt.focus();status.textContent="書き直したら送信してね。"}
function editModel(i){const text=window.prompt("返答を編集します。後の会話は消えます。",state.messages[i].text);if(text===null||!text.trim())return;if(!confirm("この返答より後の会話を消して保存しますか？"))return;state.messages[i].text=text.trim();state.messages.splice(i+1);persist();render();status.textContent="返答を編集しました。"}
function deleteFrom(i){if(!confirm("このメッセージ以降を削除しますか？\\nこの操作は元に戻せません。"))return;state.messages.splice(i);persist();render();status.textContent="選んだ場所から後を削除しました。"}
function deleteOnly(i){if(!confirm("このメッセージだけ削除しますか？\\n前後の会話が少し不自然になる場合があります。"))return;state.messages.splice(i,1);persist();render();status.textContent="このメッセージを削除しました。"}
function regenerate(i){let u=i-1;while(u>=0&&state.messages[u].role!=="user")u--;if(u<0){status.textContent="再生成する元の発言が見つかりません。";return}if(!confirm("この返答以降を消して、同じ発言から再生成しますか？"))return;const text=state.messages[u].text;state.messages.splice(u);persist();render();send(text)}
async function send(forced){const text=(forced??prompt.value).trim();if(!text||busy)return;if(!state.apiKey){status.textContent="先に設定からAPIキーを入力してね。";settings.showModal();return}busy=true;$("#send").disabled=true;prompt.disabled=true;status.textContent="Geminiが考えています…";state.messages.push({role:"user",text});prompt.value="";grow();render();persist();const typing=document.createElement("div");typing.className="msg model typing";typing.textContent="……";chat.appendChild(typing);chat.scrollTop=chat.scrollHeight;try{const contents=apiHistory().map(m=>({role:m.role==="assistant"?"model":"user",parts:[{text:m.text}]}));const body={contents,generationConfig:{temperature:Number(state.temperature),maxOutputTokens:Number(state.maxTokens)}};if(state.systemInstruction.trim())body.systemInstruction={parts:[{text:state.systemInstruction.trim()}]};const url="https://generativelanguage.googleapis.com/v1beta/models/"+encodeURIComponent(state.model)+":generateContent";const res=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json","x-goog-api-key":state.apiKey},body:JSON.stringify(body)});const data=await res.json().catch(()=>({}));if(!res.ok)throw new Error(data?.error?.message||res.status+" "+res.statusText);const answer=(data.candidates||[]).flatMap(c=>c?.content?.parts||[]).map(p=>p?.text||"").join("").trim();if(!answer)throw new Error("応答を取得できませんでした: "+(data?.promptFeedback?.blockReason||data?.candidates?.[0]?.finishReason||"応答本文が空です"));state.messages.push({role:"assistant",text:answer});persist();render();status.textContent=""}catch(err){status.textContent="エラー: "+err.message;state.messages.push({role:"assistant",text:"［接続エラー］"+err.message});persist();render()}finally{typing.remove();busy=false;$("#send").disabled=false;prompt.disabled=false;prompt.focus()}}
$("#openSettings").addEventListener("click",()=>{sync();settings.showModal()});$("#closeSettings").addEventListener("click",()=>settings.close());$("#saveSettings").addEventListener("click",()=>{state.apiKey=$("#apiKey").value.trim();state.saveKey=$("#saveKey").checked;state.model=$("#model").value.trim()||"gemini-2.5-flash";state.systemInstruction=$("#systemInstruction").value;state.historyTurns=$("#historyTurns").value==="all"?"all":Number($("#historyTurns").value)||20;state.temperature=Math.max(0,Math.min(2,Number($("#temperature").value)||1));state.maxTokens=Math.max(64,Math.min(8192,Number($("#maxTokens").value)||2048));persist();sync();settings.close();status.textContent="設定を保存しました。"});$("#clearChat").addEventListener("click",()=>{if(!confirm("この端末の会話履歴を消しますか？"))return;state.messages=[];persist();render();status.textContent="会話履歴を消去しました。"});prompt.addEventListener("input",grow);prompt.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}});$("#send").addEventListener("click",()=>send());if("serviceWorker"in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("./sw.js").catch(()=>{});load()
})();
</script></body></html>
